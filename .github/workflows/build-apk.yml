name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk TraductorPantalla.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TraductorPantalla
          path: TraductorPantalla.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Traductor de Pantalla v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: TraductorPantalla.apk
          body: |
            Descarga **TraductorPantalla.apk** desde el móvil e instálalo
            (permite «Instalar apps desconocidas» si Android lo pide).
